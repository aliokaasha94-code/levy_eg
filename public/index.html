<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LÉVY | Women's Casual Wear</title>
  <meta name="description" content="LÉVY Women's Casual Wear — تابعونا على إنستجرام وتيك توك" />
  <meta name="theme-color" content="#ede0d4" />
  
  <!-- Open Graph for sharing & QR scanning preview -->
  <meta property="og:title" content="LÉVY | Women's Casual Wear" />
  <meta property="og:description" content="Official Social Media Links" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-base: #ede0d4;
      --bg-warm: #f6eee6;
      --ink: #1b1714;
      --ink-muted: #64564c;
      --card-bg: rgba(255, 255, 255, 0.62);
      --card-hover: rgba(255, 255, 255, 0.92);
      --card-border: rgba(27, 23, 20, 0.08);
      --card-border-hover: rgba(184, 134, 93, 0.4);
      --shadow: 0 10px 30px -10px rgba(78, 52, 34, 0.08);
      --shadow-hover: 0 18px 38px -10px rgba(78, 52, 34, 0.16);
      --accent: #b8865d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--ink);
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Animated luxury background texture & drifting light orbs */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.65;
      animation: drift 16s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #f9eae1 0%, rgba(249, 234, 225, 0) 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      animation-duration: 14s;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #e2cbba 0%, rgba(226, 203, 186, 0) 70%);
      bottom: -60px;
      right: -80px;
      animation-duration: 18s;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #ecd8c8 0%, rgba(236, 216, 200, 0) 70%);
      top: 40%;
      left: -90px;
      animation-duration: 20s;
      animation-delay: -8s;
    }

    /* Subtle fine noise overlay texture */
    .noise-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.035;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @keyframes drift {
      0% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(35px) scale(1.08) translateX(20px);
      }
      100% {
        transform: translateY(-25px) scale(0.95) translateX(-20px);
      }
    }

    .container {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Logo Card styling */
    .logo-container {
      position: relative;
      margin-bottom: 14px;
      display: inline-block;
    }

    .logo-glow {
      position: absolute;
      inset: -6px;
      background: radial-gradient(circle, rgba(184, 134, 93, 0.25) 0%, transparent 70%);
      border-radius: 30px;
      filter: blur(10px);
      z-index: 0;
    }

    .logo-wrap {
      position: relative;
      width: 200px;
      max-width: 65vw;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.55);
      padding: 12px;
      border: 2.5px solid #b8865d;
      box-shadow: 0 14px 34px -8px rgba(184, 134, 93, 0.22), 0 6px 18px -4px rgba(78, 52, 34, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
    }

    .logo-wrap:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 36px -6px rgba(78, 52, 34, 0.16);
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      mix-blend-mode: multiply;
    }

    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }

    /* Links container */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      text-decoration: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: var(--card-border-hover);
      box-shadow: var(--shadow-hover);
      outline: none;
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    .link-btn:active {
      transform: scale(0.985);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 15px;
      text-align: right;
      z-index: 1;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #ffffff;
      box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .link-btn:hover .icon-box {
      transform: scale(1.06);
    }

    .icon-instagram {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .icon-tiktok {
      background: #111111;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }

    .btn-handle {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-muted);
      direction: ltr;
      text-align: right;
      letter-spacing: 0.02em;
    }

    .arrow-icon {
      color: var(--ink-muted);
      flex-shrink: 0;
      z-index: 1;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .link-btn:hover .arrow-icon {
      transform: translateX(-4px);
      color: var(--ink);
    }

    /* Footer */
    .footer {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px -2px rgba(78, 52, 34, 0.05);
      transition: all 0.22s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(27, 23, 20, 0.2);
      color: var(--ink);
      transform: translateY(-1px);
    }

    .brand-foot {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--ink-muted);
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #ffffff;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite">تم نسخ الرابط بنجاح</div>

  <script>
    const copyBtn = document.getElementById('copyLinkBtn');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    copyBtn.addEventListener('click', async () => {
      const shareData = {
        title: "LÉVY | Women's Casual Wear",
        text: "تابعي أحدث تصاميم LÉVY على إنستجرام وتيك توك",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          // User dismissed share dialog or fallback
        }
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window.location.href)
          .then(() => showToast('تم نسخ الرابط بنجاح'))
          .catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    });

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = window.location.href;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('تم نسخ الرابط بنجاح');
      } catch (e) {
        showToast('انسخ الرابط من شريط المتصفح');
      }
      document.body.removeChild(ta);
    }
  </script>
